# 在 ILCS 那台机器上起一个模拟的天平称量加料站（假天平 + Quantos + 注射泵），接进 ILCS 的后端网络，给联调与模拟实验用。
# 先起 ILCS（deploy/docker-compose.yml，项目名 ilcs，后端网络 ilcs_backend），再在仓库根目录：
#
#   docker compose -f devices/gateway/balance-dosing/deploy/compose.yml up -d --build
#
# ILCS 侧：
#   - deploy/.env 的 ILCS_ADAPTER_ALLOWED_HOSTS 加上 balance-sim，重建 api 与 executor；
#   - 工位套用接入模板 TPL-BALANCE-DOSING，连接参数填
#       base_url           = https://balance-sim:8443/api/v1
#       ca_file            = /run/secrets/ilcs/gateway/SIM-BAL-DOSE-01.crt
#       expected_device_id = SIM-BAL-DOSE-01
#     凭据 credential_ref = file:///run/secrets/ilcs/gateway/SIM-BAL-DOSE-01.token
#   模拟站自带假设备，不用另起。
#
# 证书与令牌首次启动写到仓库的 secrets/gateway/（ILCS 容器挂的是同一个目录）；作业台账在 balance-sim-state 卷里。
name: ilcs-balance-sim

services:
  balance-sim:
    build:
      context: ../../../..
      dockerfile: devices/gateway/balance-dosing/deploy/Dockerfile
    image: ilcs-balance-dosing:latest
    container_name: ilcs-balance-sim
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      GATEWAY_HOST_NAME: balance-sim
    volumes:
      - ../../../../secrets/gateway:/run/secrets/gateway
      - balance-sim-state:/var/lib/ilcs-gateway
    networks:
      - ilcs_backend

networks:
  ilcs_backend:
    external: true

volumes:
  balance-sim-state:
