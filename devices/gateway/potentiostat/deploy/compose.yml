# 在 ILCS 那台机器上起一个模拟的电化学工作站网关（容器里自带一台假 MethodSCRIPT 仪器：电导池 EIS、Li | 电解液 | 不锈钢
# 扣电的 LSV / CV / CA、开路电位），接进 ILCS 的后端网络，给联调与模拟实验用。先起 ILCS（deploy/docker-compose.yml，
# 项目名 ilcs，后端网络 ilcs_backend），再在仓库根目录：
#
#   docker compose -f devices/gateway/potentiostat/deploy/compose.yml up -d --build
#
# ILCS 侧：
#   - deploy/.env 的 ILCS_ADAPTER_ALLOWED_HOSTS 加上 potentiostat-sim，重建 api 与 executor；
#   - 工位套用接入模板 TPL-POTENTIOSTAT，连接参数填
#       base_url           = https://potentiostat-sim:8443/api/v1
#       ca_file            = /run/secrets/ilcs/gateway/SIM-ECHEM-01.crt
#       expected_device_id = SIM-ECHEM-01
#     凭据 credential_ref = file:///run/secrets/ilcs/gateway/SIM-ECHEM-01.token
#
# 证书与令牌首次启动写到仓库的 secrets/gateway/（ILCS 容器挂的是同一个目录）；作业台账与测量结论在 potentiostat-sim-state 卷里。
# 接真机：网关跑在工作站 USB 插着的那台电脑上（USB 虚拟串口），不在容器里，见 instrument-pc.md。
name: ilcs-potentiostat-sim

services:
  potentiostat-sim:
    build:
      context: ../../../..
      dockerfile: devices/gateway/potentiostat/deploy/Dockerfile
    image: ilcs-potentiostat:latest
    container_name: ilcs-potentiostat-sim
    hostname: potentiostat-sim
    restart: unless-stopped
    # 停容器时网关先给仪器发终止、等测量收尾（最多 abort_timeout_sec = 10 s）：比 Docker 缺省的 10 s 多留一些
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      GATEWAY_HOST_NAME: potentiostat-sim
      # 假仪器：出点的实际间隔 = 测量本身的间隔 × 这个系数（1 = 和真机一样：OCP-60 测 60 s，LSV-ESW 要四五十分钟）
      GATEWAY_TIME_SCALE: "1"
    volumes:
      - ../../../../secrets/gateway:/run/secrets/gateway
      - potentiostat-sim-state:/var/lib/ilcs-gateway
    networks:
      - ilcs_backend

networks:
  ilcs_backend:
    external: true

volumes:
  potentiostat-sim-state:
