# 在 ILCS 那台机器上起一个模拟的 Neware 网关（假 BTS，8 通道），接进 ILCS 的后端网络，给联调与模拟实验用。
# 先起 ILCS（deploy/docker-compose.yml，项目名 ilcs，后端网络 ilcs_backend），再在仓库根目录：
#
#   docker compose -f devices/gateway/neware-bts/deploy/compose.yml up -d --build
#
# ILCS 侧：
#   - deploy/.env 的 ILCS_ADAPTER_ALLOWED_HOSTS 加上 neware-sim，重建 api 与 executor；
#   - 工位套用接入模板 TPL-NEWARE-BTS，连接参数填
#       base_url           = https://neware-sim:8443/api/v1
#       ca_file            = /run/secrets/ilcs/gateway/SIM-NW-BTS-01.crt
#       expected_device_id = SIM-NW-BTS-01
#     凭据 credential_ref = file:///run/secrets/ilcs/gateway/SIM-NW-BTS-01.token
#   scripts/load-neware-cycler.py register 就是按这组参数登记的。
#
# 证书与令牌首次启动写到仓库的 secrets/gateway/（ILCS 容器挂的是同一个目录）；作业台账在 neware-sim-state 卷里。
name: ilcs-neware-sim

services:
  neware-sim:
    build:
      context: ../../../..
      dockerfile: devices/gateway/neware-bts/deploy/Dockerfile
    image: ilcs-neware-bts:latest
    container_name: ilcs-neware-sim
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      GATEWAY_HOST_NAME: neware-sim
      # 假 BTS 上一个测试跑多久（秒）
      GATEWAY_RUN_SECONDS: "45"
    volumes:
      - ../../../../secrets/gateway:/run/secrets/gateway
      - neware-sim-state:/var/lib/ilcs-gateway
    networks:
      - ilcs_backend

networks:
  ilcs_backend:
    external: true

volumes:
  neware-sim-state:
