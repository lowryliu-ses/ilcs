# 在 ILCS 那台机器上起一个模拟的恒温循环器 / 制冷搅拌网关（假冷水机 + 4 块假搅拌板），接进 ILCS 的后端网络，
# 给联调与模拟实验用。先起 ILCS（deploy/docker-compose.yml，项目名 ilcs，后端网络 ilcs_backend），再在仓库根目录：
#
#   docker compose -f devices/gateway/thermostat/deploy/compose.yml up -d --build
#
# 假冷水机缺省说 Huber 的 PB 命令；要试 Julabo / LAUDA，把 GATEWAY_CHILLER_KIND 改成 julabo / lauda 再 up -d。
#
# ILCS 侧：
#   - deploy/.env 的 ILCS_ADAPTER_ALLOWED_HOSTS 加上 thermostat-sim，重建 api 与 executor；
#   - 工位套用接入模板 TPL-THERMOSTAT，连接参数填
#       base_url           = https://thermostat-sim:8443/api/v1
#       ca_file            = /run/secrets/ilcs/gateway/SIM-CHILL-01.crt
#       expected_device_id = SIM-CHILL-01
#     凭据 credential_ref = file:///run/secrets/ilcs/gateway/SIM-CHILL-01.token
#
# 证书与令牌首次启动写到仓库的 secrets/gateway/（ILCS 容器挂的是同一个目录）；作业台账与作业记录在
# thermostat-sim-state 卷里。容器停止时网关先把在跑的（假）板停下，给它留够时间。
name: ilcs-thermostat-sim

services:
  thermostat-sim:
    build:
      context: ../../../..
      dockerfile: devices/gateway/thermostat/deploy/Dockerfile
    image: ilcs-thermostat:latest
    container_name: ilcs-thermostat-sim
    hostname: thermostat-sim
    restart: unless-stopped
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      GATEWAY_HOST_NAME: thermostat-sim
      GATEWAY_CHILLER_KIND: huber
    volumes:
      - ../../../../secrets/gateway:/run/secrets/gateway
      - thermostat-sim-state:/var/lib/ilcs-gateway
    networks:
      - ilcs_backend

networks:
  ilcs_backend:
    external: true

volumes:
  thermostat-sim-state:
